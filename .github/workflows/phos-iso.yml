name: Gerar ISO PHOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phos-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Compilar em Debian 13 e montar a ISO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/iso-output"
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            debian:13 \
            bash tools/ci/build-phos-iso.sh 2>&1 | tee iso-output/build.log

      - name: Guardar ISO e checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: phos-iso-amd64-${{ github.run_number }}
          path: |
            iso-output/*.iso
            iso-output/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Guardar log mesmo em caso de erro
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: phos-build-log-${{ github.run_number }}
          path: iso-output/build.log
          if-no-files-found: warn
          retention-days: 7
